name: algorithms-homework-5
services:
  visualization:
    build:
      context: ..
      dockerfile: visualization/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8085}:8085"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
  tests:
    profiles: [tests]
    build:
      context: ..
      dockerfile: Dockerfile.tests
