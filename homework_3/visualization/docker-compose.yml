name: algorithms-homework-3
services:
  visualization:
    build:
      context: ..
      dockerfile: visualization/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8083}:8083"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  tests:
    profiles: [tests]
    build:
      context: ..
      dockerfile: Dockerfile.tests
