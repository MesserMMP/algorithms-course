name: algorithms-homework-2
services:
  visualization:
    build:
      context: ..
      dockerfile: visualization/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8082}:8082"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
